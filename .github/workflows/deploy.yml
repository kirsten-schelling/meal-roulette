name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a queued one waits rather than cancelling a release mid-migration.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --remote-only --app meal-roulette
      # The app must stay tailnet-only; fail loudly if a public address ever appears.
      - name: Check there is no public IP
        run: test "$(flyctl ips list --app meal-roulette --json | jq length)" = 0
