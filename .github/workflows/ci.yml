name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: meal_roulette
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/meal_roulette
      - name: Prettier
        run: npx prettier@3.3.3 --check .
