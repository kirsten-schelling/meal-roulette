[package]
name = "domain"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }
serde = { version = "1.0", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-float"] }