[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
domain = { path = "../domain" }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rust_decimal = "1"

# The data layer, called from inside #[server] bodies. Optional so that only the `server`
# feature pulls it (and sqlx, axum, tokio) in; the wasm build never sees it.
api = { path = "../api", optional = true }

# In the browser (WebAssembly) build, `uuid` — pulled in transitively via the
# `domain` crate — needs a JS-backed source of randomness or it refuses to
# compile. This target-only dep turns on that backend for the wasm build; the
# native server build is unaffected. Cargo unifies features, so the copy of
# `uuid` that `domain` uses picks up `js` here too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# Native clients (desktop, Android) have no JS timers; dioxus runs them on a tokio runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["time"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:api"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
