[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }

# server-only deps (used inside #[server] bodies, gated by the `server` feature)
reqwest = { version = "0.12", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:reqwest", "dep:serde_json"]

# Standalone — opt out of the parent Cargo workspace at the repo root.
[workspace]
