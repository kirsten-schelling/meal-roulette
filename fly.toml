app = "meal-roulette"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "sh -c 'sqlx migrate run --source /app/migrations --database-url \"$MIGRATE_DATABASE_URL\"'"

[mounts]
  source = "tailscale_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
